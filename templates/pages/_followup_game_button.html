{% if event.event_type == 'game' or event.event_type == 'tournament' %}
  <form method="post" action="{% url 'event_add_followup' event.pk %}" class="followup-game-form">
    {% csrf_token %}
    <button class="followup-game-button" type="submit" title="Clone game" aria-label="Clone {{ event.title }}"><span aria-hidden="true">+</span></button>
  </form>
{% endif %}
