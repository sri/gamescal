<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-labelledby="title description">
  <title id="title">Gcal</title>
  <desc id="description">Gcal logo: a calendar with a route marker beside the Gcal wordmark.</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity=".18"/>
    </filter>
    <style>
      .wordmark { fill: #172033; }
      .tagline { fill: #64748b; }
      @media (prefers-color-scheme: dark) {
        .wordmark { fill: #f8fafc; }
        .tagline { fill: #cbd5e1; }
      }
    </style>
  </defs>

  <g filter="url(#shadow)">
    <rect x="24" y="24" width="192" height="192" rx="46" fill="url(#brand)"/>
  </g>

  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <rect x="57" y="63" width="126" height="118" rx="20" stroke-width="10"/>
    <path d="M57 96h126M87 52v25M153 52v25" stroke-width="10"/>
    <path d="M78 148c15-25 30-24 43-7 12 16 26 13 38-8" stroke-width="8"/>
  </g>
  <circle cx="78" cy="148" r="7" fill="#fff"/>
  <path d="M160 117c-13 0-23 10-23 23 0 18 23 36 23 36s23-18 23-36c0-13-10-23-23-23Zm0 32a9 9 0 1 1 0-18 9 9 0 0 1 0 18Z" fill="#fff"/>

  <text class="wordmark" x="258" y="137" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="112" font-weight="800" letter-spacing="-6">Gcal</text>
  <text class="tagline" x="266" y="179" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="600" letter-spacing="1">ONE SCHEDULE. EVERY GAME.</text>
</svg>
